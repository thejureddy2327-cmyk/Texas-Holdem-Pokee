<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hold'em Friends</title><link rel="stylesheet" href="style.css"></head><body>
<div class="wrap"><header><div><b>♠ HOLD'EM</b><small> FRIENDS</small></div><span id="room"></span></header>
<section id="lobby" class="cardbox"><h1>Private poker night</h1><input id="name" placeholder="Your name" maxlength="18"><div class="grid"><button id="create">Create room</button><input id="code" placeholder="Room code" maxlength="5"><button id="join">Join room</button></div><div class="grid"><label>Small blind <input id="sb" type="number" value="10"></label><label>Big blind <input id="bb" type="number" value="20"></label></div><p id="err"></p></section>
<main id="game" hidden><div class="bar"><span id="phase"></span><span id="pot"></span><button id="copy">Share room</button></div><div class="table"><div id="seats"></div><div class="center"><div id="community" class="cards"></div><div class="potline" id="potline"></div><div id="msg"></div></div><div class="me"><div id="mine" class="cards"></div><div id="actions"></div></div></div><div class="below"><div id="lobbyAction"></div><div class="chat"><div id="chatlog"></div><div><input id="chatinput" placeholder="Chat with friends"><button id="send">Send</button></div></div></div></main></div>
<script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
